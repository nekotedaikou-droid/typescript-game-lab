<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ゲーム開発実験 Stage 2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #ffffff;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 18px;
      color: #aaaaaa;
      letter-spacing: 0.05em;
    }
    #gameWrapper {
      position: relative;
      user-select: none;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      border: 2px solid #444444;
    }
    #retryButton {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 36px;
      font-size: 20px;
      font-weight: bold;
      background: #4a9eff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }
    #retryButton:hover {
      background: #2a7edd;
    }
    .instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #888888;
      text-align: center;
      line-height: 1.5;
    }

    /* ============================================================
       段階2: タッチ環境用スタイル（追補T-8）
       ============================================================ */

    /* タッチ環境の場合にbodyへtouch-envクラスを付与する */
    body.touch-env h1,
    body.touch-env .instructions {
      /* タッチ環境では見出しと操作説明を非表示（追補T-8.3） */
      display: none;
    }
    body.touch-env {
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
      min-height: 100dvh;
      height: 100dvh;
      width: 100vw;
    }
    body.touch-env #gameWrapper {
      position: relative;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      height: auto;
    }

    /* 修正A・B・C: 縮小はゲーム画面(#gameCanvas)だけにCSS表示サイズで適用し、画面中央に収める */
    /* 内部解像度(897×897)と座標計算は変更せず、表示のみ縮小 */
    body.touch-env #gameCanvas {
      width: var(--canvas-display-size, 897px);
      height: var(--canvas-display-size, 897px);
      max-width: 100vw;
      max-height: 100vh;
      display: block;
    }

    /* 仮想十字キー（追補T-5）: canvas上に重ねて表示 */
    #virtualDpad {
      display: none; /* デフォルト非表示。タッチ環境でJSが表示 */
      position: fixed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: none; /* 修正A: canvas共通の枠線(border: 2px solid #444444)を排除 */
      /* 位置・サイズはJavaScriptで設定（env(safe-area-inset-*)対応） */
    }

    /* 仮想STARTボタン（追補T-6）: canvas上に重ねて表示 */
    #virtualStart {
      display: none; /* デフォルト非表示。タッチ環境でJSが表示 */
      position: fixed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      line-height: 1.1;
      border-radius: 50%;
      cursor: pointer;
    }

    /* ブラウザのデフォルト動作の抑止（追補T-8.5） */
    body.touch-env {
      overflow: hidden;
      overscroll-behavior: none;
      /* ピンチ拡大縮小を抑止 */
      touch-action: none;
    }
  </style>
</head>
<body>
  <h1>ゲーム開発実験 Stage 2</h1>
  <div id="gameWrapper">
    <canvas id="gameCanvas" width="897" height="897"></canvas>
    <button id="retryButton">Retry</button>
  </div>
  <div class="instructions">
    矢印キー／WASD（移動）、Space（ポーズ）、R（リトライ）、コントローラー：十字キー（移動）／START（ポーズ・リトライ）
  </div>

  <!-- 仮想十字キー（canvasの外に置き、fixed位置で重ねる） -->
  <canvas id="virtualDpad"></canvas>
  <!-- 仮想STARTボタン -->
  <div id="virtualStart"></div>

  <script>
// ==========================================
// 1. constants.js
// ==========================================
// グリッド・描画定数
const GRID_SIZE = 13;
const CELL_SIZE = 69;
const CANVAS_SIZE = GRID_SIZE * CELL_SIZE; // 897
// プレイヤー関連
const PLAYER_INITIAL_HP = 3;
const PLAYER_MAX_HP = 3;
const PLAYER_SPEED = 1.5; // グリッド/秒
const PLAYER_RADIUS = 0.4;
const INVINCIBLE_DURATION = 1.5; // 無敵時間（秒）
// 攻撃関連
const ATTACK_INTERVAL_TIER0 = 1.0; // 秒
const ATTACK_INTERVAL_UPGRADED = 0.5; // 秒
const BULLET_SPEED = 6.0; // 暫定値: グリッド/秒
const BULLET_RADIUS = 0.2;
// 敵基本スペック
const NORMAL_ENEMY_HP = 1;
const NORMAL_ENEMY_SPEED = 0.75;
const NORMAL_ENEMY_RADIUS = 0.4;
const ELITE_ENEMY_HP = 3;
const ELITE_ENEMY_SPEED = 0.75;
const ELITE_ENEMY_RADIUS = 0.5;
const BOSS_ENEMY_HP = 5;
const BOSS_ENEMY_SPEED = 0.6;
const BOSS_ENEMY_RADIUS = 0.7;
// スポーン・戦闘構造定数（第6.3版準拠）
const NORMAL_ENEMY_TARGET_COUNT = 5; // 雑魚敵の維持目標数（5体）
const NORMAL_RESPAWN_DELAY = 1.0; // 雑魚撃破後、補充までの時間（1秒）
const FU_PHASE_KILL_LIMIT = 5; // 歩の雑魚フェーズ: 累計5体撃破で補充停止
const GIN_MOB_KILLS_PER_ELITE = 5; // 銀: 雑魚敵5体倒すごとに強敵1体出現
const BOSS_SPAWN_GRACE_PERIOD = 10.0; // ボス出現直後、通常敵・強敵の新規出現を停止する時間（10秒）
// 簡易分離処理
const SEPARATION_DISTANCE = 0.6; // 暫定値: 簡易分離の距離閾値
const SEPARATION_FORCE = 1.2;
// アイテム関連
const ITEM_RADIUS = 0.35;
const MAX_ITEMS_ON_FIELD = 10; // 画面上に存在できるアイテム最大数（10個）
const ELITE_KILLS_PER_ITEM = 3; // 強敵3体撃破ごとにアイテム出現
const FU_MOB_KILLS_PER_ITEM = 10; // 歩の雑魚10体撃破ごとに歩アイテム出現
// 演出関連
const EVOLUTION_DURATION = 3.0; // 歩→銀への進化演出時間（約3秒）
// 扉・クリア関連
const DOOR_RADIUS = 0.5;
const MAX_ELAPSED_TIME = 9999; // 経過時間カンスト表示（秒）
// リトライ待ち時間（段階1: 追補T-4.3）
const RETRY_WAIT_DURATION = 3.0; // リトライ待ち時間（秒、初期値3秒）

// ==========================================
// 段階2: タッチ関連定数（追補T-5, T-6, T-8、実機調整版）
// ==========================================
// URLパラメータによる調整値の上書き（実機調整用、指定がなければ初期値を使用）
const _urlParams = (typeof window !== 'undefined' && window.location && window.location.search && typeof URLSearchParams !== 'undefined')
    ? new URLSearchParams(window.location.search)
    : null;

function _getParamFloat(key, defaultVal) {
    if (!_urlParams || !_urlParams.has(key)) return defaultVal;
    const v = parseFloat(_urlParams.get(key));
    return isNaN(v) ? defaultVal : v;
}

// 仮想十字キー（追補T-5.3、実機調整）
const DPAD_SIZE = _getParamFloat('dpad', 208);                 // 十字キー見た目の領域の一辺（px、調整値: 208）
const DPAD_ARM_RATIO = _getParamFloat('arm', 0.46);           // 各腕の幅比率（調整値: 0.46）
const DPAD_DEAD_ZONE_RATIO = _getParamFloat('dead', 0.14);     // 不感帯の半径比率（調整値: 0.14）
const DPAD_AXIS_THRESHOLD_RATIO = _getParamFloat('axis', 1.3); // 中央の四角での軸切替しきい値倍率（初期値: 1.3）
const DPAD_OPACITY = _getParamFloat('opacity', 0.50);         // 仮想十字キーの不透明度（初期値: 0.50）
const DPAD_MARGIN_LEFT = _getParamFloat('mleft', 16);         // 左端からの距離（px、調整値: 16）
const DPAD_MARGIN_BOTTOM = _getParamFloat('mbottom', 16);     // 下端からの距離（px、調整値: 16）
const DPAD_HIT_PADDING = _getParamFloat('pad', 28);           // 見た目の外側の見えない反応範囲（px、上下左右各28px）
// 仮想STARTボタン（追補T-6, T-8.7）
const VSTART_SIZE = 80;          // 仮想STARTの直径（px）。初期値案72〜88px
const VSTART_MARGIN_BOTTOM = 40; // 下端からの距離（px）

// ==========================================
// 段階2: タッチ環境判定（追補T-2, U-6）
// ==========================================
/**
 * タッチ主体の環境かどうかを判定する。
 * 判定方法: window.matchMedia('(pointer: coarse)') を使い、
 *   「主ポインタがコアース（指）」の場合をタッチ環境とする。
 * 外れ得る場合:
 *   - キーボード付きタブレット: キーボード接続時でも coarse のまま → タッチ環境と判定される
 *     （ただし、キーボード・ゲームパッド入力は有効なままにする）
 *   - マウス接続タブレット: fine に変わる機種では PC として判定される
 *   - 開発者ツールのデバイスモード: coarse になるためタッチ環境と判定される
 */
const IS_TOUCH_ENV = (typeof window.matchMedia === 'function')
    ? window.matchMedia('(pointer: coarse)').matches
    : false;

// ==========================================
// 2. input.js
// ==========================================
class InputManager {
    constructor() {
        this.pressedKeys = new Set();
        this.prevStartPressed = false;
        this.prevRetryKeyPressed = false;
        this.startJustPressed = false;
        this.retryKeyJustPressed = false;

        // 段階2: 仮想十字キーの方向（null | 'up' | 'down' | 'left' | 'right'）
        this.virtualDpadDir = null;
        // 段階2: 仮想STARTの「押した瞬間」フラグ（サブフレームタップ取りこぼし防止）
        this.virtualStartPending = false;

        window.addEventListener('keydown', (e) => {
            this.pressedKeys.add(e.code);
            // スクロール等のデフォルト動作を防止
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            this.pressedKeys.delete(e.code);
        });
        // 段階1: フォーカス喪失時・非表示時の入力全解除（追補T-7）
        window.addEventListener('blur', () => {
            this.clearInputs();
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.clearInputs();
            }
        });
        // 段階2: 画面の向きが変わったときの入力全解除（追補T-7.1）
        window.addEventListener('orientationchange', () => {
            this.clearInputs();
        });
    }
    /**
     * キーボード・ボタン押下状態の全解除
     * 修正1: ゲームパッドSTARTの押下状態に合わせてprevStartPressedを維持し誤発動を防止（追補T-7.3）
     * 段階2: 仮想十字キーの方向・仮想STARTの押下状態も解除（追補T-7.2）
     * 解除によってポーズ・リトライが誤発動しないよう、virtualStartPendingもfalseにする（追補T-7.3）
     */
    clearInputs() {
        this.pressedKeys.clear();
        this.startJustPressed = false;
        this.retryKeyJustPressed = false;
        // 仮想入力の解除（追補T-7.2）
        this.virtualDpadDir = null;
        this.virtualStartPending = false;
        const gp = this.getGamepad();
        const gpStartPressed = gp ? !!gp.buttons[9]?.pressed : false;
        this.prevStartPressed = gpStartPressed;
        this.prevRetryKeyPressed = false;
    }
    /**
     * 毎フレームの入力状態更新（ゲーム状態に関係なく毎フレーム実行）
     * 段階2: 仮想START（virtualStartPending）をSTART系判定に組み込む（追補T-6）
     */
    update() {
        const spacePressed = this.pressedKeys.has('Space');
        const gp = this.getGamepad();
        const gpStartPressed = gp ? !!gp.buttons[9]?.pressed : false;
        const currentStartPressed = spacePressed || gpStartPressed;

        // START系（Space または ゲームパッドSTART または 仮想START）の押した瞬間判定
        // virtualStartPendingは「押した瞬間」のワンショットフラグ（サブフレームタップ対応）
        this.startJustPressed = (currentStartPressed && !this.prevStartPressed) || this.virtualStartPending;
        this.prevStartPressed = currentStartPressed;
        // 消費（ワンショット）
        this.virtualStartPending = false;

        // Rキーの押した瞬間判定
        const currentRPressed = this.pressedKeys.has('KeyR');
        this.retryKeyJustPressed = currentRPressed && !this.prevRetryKeyPressed;
        this.prevRetryKeyPressed = currentRPressed;
    }
    /**
     * 現在の移動方向ベクトル（直交4方向、正規化）を取得する
     * 段階1: WASDキーの追加（追補T-3.1）
     * 段階2: 仮想十字キーの方向を合流（追補T-3.2）
     */
    getMovementInput() {
        let vx = 0;
        let vy = 0;
        // キーボード入力（矢印キー または WASD）
        if (this.pressedKeys.has('ArrowLeft') || this.pressedKeys.has('KeyA'))
            vx -= 1;
        if (this.pressedKeys.has('ArrowRight') || this.pressedKeys.has('KeyD'))
            vx += 1;
        if (this.pressedKeys.has('ArrowUp') || this.pressedKeys.has('KeyW'))
            vy -= 1;
        if (this.pressedKeys.has('ArrowDown') || this.pressedKeys.has('KeyS'))
            vy += 1;
        // ゲームパッド入力（十字キー: 14左, 15右, 12上, 13下）
        const gp = this.getGamepad();
        if (gp) {
            if (gp.buttons[14]?.pressed)
                vx -= 1;
            if (gp.buttons[15]?.pressed)
                vx += 1;
            if (gp.buttons[12]?.pressed)
                vy -= 1;
            if (gp.buttons[13]?.pressed)
                vy += 1;
        }
        // 段階2: 仮想十字キーの方向を合流（追補T-3.2, T-5）
        // ゲームの状態にかかわらずgetMovementInputを呼ぶのはplaying中のみなので、
        // ここで直接mergeする（playing中でなければDpad入力は無視される）
        if (this.virtualDpadDir === 'left')  vx -= 1;
        if (this.virtualDpadDir === 'right') vx += 1;
        if (this.virtualDpadDir === 'up')    vy -= 1;
        if (this.virtualDpadDir === 'down')  vy += 1;

        // クランプ (-1, 0, 1)
        vx = Math.max(-1, Math.min(1, vx));
        vy = Math.max(-1, Math.min(1, vy));
        // 仕様: 意図的な斜め移動は行わない。
        // 同時入力時は横移動を優先して縦入力をキャンセル
        if (vx !== 0 && vy !== 0) {
            vy = 0;
        }
        return { x: vx, y: vy };
    }
    /**
     * START系ボタン（Space / START: 9 / 仮想START）が「押された瞬間」かどうか
     */
    isStartJustPressed() {
        return this.startJustPressed;
    }
    /**
     * リトライ（START系 / Rキー）が「押された瞬間」かどうか
     */
    isRetryJustPressed() {
        return this.startJustPressed || this.retryKeyJustPressed;
    }
    getGamepad() {
        if (!navigator.getGamepads)
            return null;
        const gamepads = navigator.getGamepads();
        for (const gp of gamepads) {
            if (gp && gp.connected) {
                return gp;
            }
        }
        return null;
    }
}

// ==========================================
// 3. player.js
// ==========================================
class Player {
    constructor() {
        this.pos = { x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) };
        this.facing = 'up';
        this.piece = 'fu';
        this.upgradeLevel = 0;
        this.hp = PLAYER_INITIAL_HP;
        this.maxHp = PLAYER_MAX_HP;
        this.invincibleTimer = 0;
        this.attackTimer = 0;
    }
    get isInvincible() {
        return this.invincibleTimer > 0;
    }
    /**
     * 現在の攻撃間隔（秒）を取得
     */
    get attackInterval() {
        if (this.upgradeLevel === 0) {
            return ATTACK_INTERVAL_TIER0; // 1.0秒
        }
        return ATTACK_INTERVAL_UPGRADED; // 0.5秒
    }
    /**
     * 現在の最大攻撃範囲（マス）を取得
     */
    get attackRange() {
        // 強化0: 1マス, 強化1: 2マス, 強化2: 3マス
        return this.upgradeLevel + 1;
    }
    /**
     * 向きに応じた前方単位ベクトル
     */
    getFacingVector() {
        switch (this.facing) {
            case 'up': return { x: 0, y: -1 };
            case 'down': return { x: 0, y: 1 };
            case 'left': return { x: -1, y: 0 };
            case 'right': return { x: 1, y: 0 };
        }
    }
    /**
     * 移動と向きの更新
     */
    update(dt, moveInput) {
        // 移動方向に入力があれば向きを更新（停止中は向きを維持）
        if (moveInput.x > 0)
            this.facing = 'right';
        else if (moveInput.x < 0)
            this.facing = 'left';
        else if (moveInput.y > 0)
            this.facing = 'down';
        else if (moveInput.y < 0)
            this.facing = 'up';
        // 座標移動
        this.pos.x += moveInput.x * PLAYER_SPEED * dt;
        this.pos.y += moveInput.y * PLAYER_SPEED * dt;
        // ステージ境界クランプ
        const minBound = PLAYER_RADIUS;
        const maxBound = (GRID_SIZE - 1) - PLAYER_RADIUS;
        this.pos.x = Math.max(minBound, Math.min(maxBound, this.pos.x));
        this.pos.y = Math.max(minBound, Math.min(maxBound, this.pos.y));
        // 無敵タイマー減算
        if (this.invincibleTimer > 0) {
            this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
        }
    }
    takeDamage() {
        if (this.isInvincible)
            return;
        this.hp = Math.max(0, this.hp - 1);
        this.invincibleTimer = INVINCIBLE_DURATION;
    }
    heal(amount = 1) {
        this.hp = Math.min(this.maxHp, this.hp + amount);
    }
    /**
     * 歩の強化
     */
    upgradeFu() {
        if (this.piece === 'fu' && this.upgradeLevel < 2) {
            this.upgradeLevel += 1;
        }
    }
    /**
     * 銀へ変化
     */
    evolveToGin() {
        if (this.piece === 'fu' && this.upgradeLevel === 2) {
            this.piece = 'gin';
            this.upgradeLevel = 0;
            this.attackTimer = 0; // 仕様: 銀変化時に攻撃間隔は1.0秒へリセット
        }
    }
    /**
     * 銀の強化
     */
    upgradeGin() {
        if (this.piece === 'gin' && this.upgradeLevel < 2) {
            this.upgradeLevel += 1;
        }
    }
    /**
     * 仕様書 24 に従う初期化
     */
    reset() {
        this.pos = { x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) };
        this.facing = 'up';
        this.piece = 'fu';
        this.upgradeLevel = 0;
        this.hp = PLAYER_INITIAL_HP;
        this.maxHp = PLAYER_MAX_HP;
        this.invincibleTimer = 0;
        this.attackTimer = 0;
    }
    draw(ctx) {
        const px = this.pos.x * CELL_SIZE;
        const py = this.pos.y * CELL_SIZE;
        const r = PLAYER_RADIUS * CELL_SIZE;
        ctx.save();
        ctx.translate(px, py);
        // 無敵時間中の点滅（10Hz）
        if (this.isInvincible && Math.floor(this.invincibleTimer * 10) % 2 === 0) {
            ctx.globalAlpha = 0.35;
        }
        // 向きに応じた回転
        let angle = 0;
        switch (this.facing) {
            case 'up':
                angle = 0;
                break;
            case 'right':
                angle = Math.PI / 2;
                break;
            case 'down':
                angle = Math.PI;
                break;
            case 'left':
                angle = -Math.PI / 2;
                break;
        }
        ctx.rotate(angle);
        // 将棋駒の五角形パス
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.15); // 先端（前）
        ctx.lineTo(r * 0.85, -r * 0.4); // 右肩
        ctx.lineTo(r * 0.75, r * 0.9); // 右下
        ctx.lineTo(-r * 0.75, r * 0.9); // 左下
        ctx.lineTo(-r * 0.85, -r * 0.4); // 左肩
        ctx.closePath();
        // 駒の地色（歩と銀で質感をわずかに変化）
        if (this.piece === 'fu') {
            ctx.fillStyle = '#e8c39e'; // 木駒色
        }
        else {
            ctx.fillStyle = '#dcdde1'; // 銀駒色（明るい銀白）
        }
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = this.piece === 'fu' ? '#6b4c2a' : '#57606f';
        ctx.stroke();
        // 駒の文字（「歩」または「銀」）
        ctx.fillStyle = '#111111';
        ctx.font = `bold ${Math.floor(r * 0.9)}px "Yu Mincho", "Hiragino Mincho ProN", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const kanji = this.piece === 'fu' ? '歩' : '銀';
        ctx.fillText(kanji, 0, r * 0.1);
        ctx.restore();
    }
}

// ==========================================
// 4. bullet.js
// ==========================================
class Bullet {
    constructor(startPos, dir, maxRange) {
        this.isDestroyed = false;
        this.pos = { x: startPos.x, y: startPos.y };
        // 方向ベクトルの正規化
        const len = Math.hypot(dir.x, dir.y);
        if (len > 0) {
            this.dir = { x: dir.x / len, y: dir.y / len };
        }
        else {
            this.dir = { x: 0, y: -1 };
        }
        this.traveledDistance = 0;
        this.maxRange = maxRange;
    }
    update(dt) {
        if (this.isDestroyed)
            return;
        const step = BULLET_SPEED * dt;
        this.pos.x += this.dir.x * step;
        this.pos.y += this.dir.y * step;
        this.traveledDistance += step;
        // 最大射程に達したら消滅
        if (this.traveledDistance >= this.maxRange) {
            this.isDestroyed = true;
        }
    }
    draw(ctx) {
        if (this.isDestroyed)
            return;
        const px = this.pos.x * CELL_SIZE;
        const py = this.pos.y * CELL_SIZE;
        const r = BULLET_RADIUS * CELL_SIZE;
        ctx.save();
        // 弾のグロー効果
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00d2d3';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fillStyle = '#54a0ff';
        ctx.fill();
        // 中央ハイライト
        ctx.beginPath();
        ctx.arc(px, py, r * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
    }
}

// ==========================================
// 5. enemy.js
// ==========================================
class Enemy {
    constructor(type, spawnPos) {
        this.wasContacting = false;
        this.isDead = false;
        this.type = type;
        this.pos = { x: spawnPos.x, y: spawnPos.y };
        switch (type) {
            case 'normal':
                this.hp = NORMAL_ENEMY_HP;
                this.maxHp = NORMAL_ENEMY_HP;
                this.speed = NORMAL_ENEMY_SPEED;
                this.radius = NORMAL_ENEMY_RADIUS;
                break;
            case 'elite':
                this.hp = ELITE_ENEMY_HP;
                this.maxHp = ELITE_ENEMY_HP;
                this.speed = ELITE_ENEMY_SPEED;
                this.radius = ELITE_ENEMY_RADIUS;
                break;
            case 'boss':
                this.hp = BOSS_ENEMY_HP;
                this.maxHp = BOSS_ENEMY_HP;
                this.speed = BOSS_ENEMY_SPEED;
                this.radius = BOSS_ENEMY_RADIUS;
                break;
        }
    }
    /**
     * プレイヤーへ向けて追従移動
     */
    update(dt, playerPos) {
        if (this.isDead)
            return;
        const dx = playerPos.x - this.pos.x;
        const dy = playerPos.y - this.pos.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.001) {
            this.pos.x += (dx / dist) * this.speed * dt;
            this.pos.y += (dy / dist) * this.speed * dt;
        }
        // ステージ境界クランプ
        const minBound = this.radius;
        const maxBound = (GRID_SIZE - 1) - this.radius;
        this.pos.x = Math.max(minBound, Math.min(maxBound, this.pos.x));
        this.pos.y = Math.max(minBound, Math.min(maxBound, this.pos.y));
    }
    takeDamage(amount = 1) {
        this.hp -= amount;
        if (this.hp <= 0) {
            this.hp = 0;
            this.isDead = true;
        }
    }
    draw(ctx) {
        if (this.isDead)
            return;
        const px = this.pos.x * CELL_SIZE;
        const py = this.pos.y * CELL_SIZE;
        const r = this.radius * CELL_SIZE;
        ctx.save();
        if (this.type === 'normal') {
            // 通常敵: 赤い円
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#c0392b';
            ctx.stroke();
        }
        else if (this.type === 'elite') {
            // 強敵: 濃紫/赤紫の円 + 二重枠 + HP文字
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = '#8e44ad';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#e74c3c';
            ctx.stroke();
            // HP数字表示
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.floor(r * 0.9)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(this.hp), px, py);
        }
        else if (this.type === 'boss') {
            // ボス: 巨大なダークレッド円 + 金色枠 + グロー
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#e74c3c';
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = '#2c001e';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#f1c40f';
            ctx.stroke();
            ctx.shadowBlur = 0;
            // ボスHPバー（ボスの頭上に描画）
            const barWidth = r * 2.2;
            const barHeight = 8;
            const barX = px - barWidth / 2;
            const barY = py - r - 16;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            const hpPercent = this.hp / this.maxHp;
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
            // BOSS テキスト
            ctx.fillStyle = '#f1c40f';
            ctx.font = `bold ${Math.floor(r * 0.55)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('BOSS', px, py);
        }
        ctx.restore();
    }
}
/**
 * 通常敵同士の重なりを避ける簡易分離処理
 * 修正3: 完全重複（距離0）時もランダムな方向へ分離（追補2）
 */
function applySeparation(enemies, dt) {
    for (let i = 0; i < enemies.length; i++) {
        const e1 = enemies[i];
        if (e1.type !== 'normal' || e1.isDead)
            continue;
        for (let j = i + 1; j < enemies.length; j++) {
            const e2 = enemies[j];
            if (e2.type !== 'normal' || e2.isDead)
                continue;
            const dx = e1.pos.x - e2.pos.x;
            const dy = e1.pos.y - e2.pos.y;
            const dist = Math.hypot(dx, dy);
            if (dist < SEPARATION_DISTANCE) {
                // 反発方向の決定（完全に同じ位置またはほぼ同じ位置の場合はランダムな方向）
                let dirX, dirY;
                if (dist > 0.0001) {
                    dirX = dx / dist;
                    dirY = dy / dist;
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    dirX = Math.cos(angle);
                    dirY = Math.sin(angle);
                }
                // 反発ベクトル
                const overlap = SEPARATION_DISTANCE - dist;
                const pushX = dirX * overlap * SEPARATION_FORCE * dt;
                const pushY = dirY * overlap * SEPARATION_FORCE * dt;
                e1.pos.x += pushX;
                e1.pos.y += pushY;
                e2.pos.x -= pushX;
                e2.pos.y -= pushY;
            }
        }
    }
}

class Item {
    constructor(pos, type) {
        this.radius = ITEM_RADIUS;
        this.isCollected = false;
        this.pos = { x: pos.x, y: pos.y };
        this.type = type;
    }
    draw(ctx) {
        if (this.isCollected)
            return;
        const px = this.pos.x * CELL_SIZE;
        const py = this.pos.y * CELL_SIZE;
        const r = this.radius * CELL_SIZE;
        ctx.save();
        if (this.type === 'fu_upgrade') {
            // 歩の強化アイテム: 緑のオーブ + 「歩+」
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#2ed573';
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = '#2ed573';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.floor(r * 0.9)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('歩+', px, py);
        }
        else if (this.type === 'gin_piece') {
            // 銀の駒（進化用）: 白銀色の五角形ミニ駒 + 「銀」
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#dcdde1';
            ctx.translate(px, py);
            ctx.beginPath();
            ctx.moveTo(0, -r * 1.15);
            ctx.lineTo(r * 0.85, -r * 0.4);
            ctx.lineTo(r * 0.75, r * 0.9);
            ctx.lineTo(-r * 0.75, r * 0.9);
            ctx.lineTo(-r * 0.85, -r * 0.4);
            ctx.closePath();
            ctx.fillStyle = '#f5f6fa';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#718093';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#2f3640';
            ctx.font = `bold ${Math.floor(r * 0.9)}px "Yu Mincho", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('銀', 0, r * 0.1);
        }
        else if (this.type === 'gin_heal_piece') {
            // 銀の駒（回復用）: 紫色の五角形ミニ駒 + 白い太字「＋」
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#8e44ad';
            ctx.translate(px, py);
            ctx.beginPath();
            ctx.moveTo(0, -r * 1.15);
            ctx.lineTo(r * 0.85, -r * 0.4);
            ctx.lineTo(r * 0.75, r * 0.9);
            ctx.lineTo(-r * 0.75, r * 0.9);
            ctx.lineTo(-r * 0.85, -r * 0.4);
            ctx.closePath();
            ctx.fillStyle = '#9b59b6';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#5e2d79';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.floor(r * 1.1)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('＋', 0, r * 0.05);
        }
        else if (this.type === 'gin_upgrade') {
            // 銀の強化アイテム: 青紫のオーブ + 「銀+」
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#9b59b6';
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = '#9b59b6';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.floor(r * 0.9)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('銀+', px, py);
        }
        ctx.restore();
    }
}
